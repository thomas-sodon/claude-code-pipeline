# AI review for the pipeline's monitor: copy this file and answerable-ai-review-replies.yml to
# .github/workflows/ (keep both names).
#
# On every push to a pull request it reviews the diff with Claude, posts its findings as review
# comments and resolves its earlier threads whose defect is fixed (check `Review`), then fails a
# second check, `Reply coverage`, while any finding has no reply. plan-to-merged-pr's monitor waits
# for `Review` before counting comments, and its /process-comments step fixes or answers each
# finding; a reply re-runs only `Reply coverage`, from answerable-ai-review-replies.yml.
#
# Setup:
# - Add the secret CLAUDE_CODE_OAUTH_TOKEN by name: `gh secret set CLAUDE_CODE_OAUTH_TOKEN` prompts for
#   the value (from `claude setup-token`). Never paste the value into a chat, a file or a commit.
# - Pass ai_review_check: 'Review' to plan-to-merged-pr, proposal-build-chain, ship-chain and bug-fix-backlog,
#   so the monitor waits for this check (proposal-build-chain copies it into each lane's ship plan).
#   `Review` is the `name:` of the review job below: if you change it, or use another review workflow,
#   pass that job's `name:` instead, or its key under `jobs:` when it has none.
# - To make unanswered findings block merge, require the status check `Reply coverage` on main
#   (Settings -> Rules, or branch protection), next to your CI check. It is offered after its first run.
# - Fork PRs get no secrets, so `Review` is skipped on them.
name: Answerable AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Replies to findings re-run the gate from answerable-ai-review-replies.yml,
  # so they don't add a skipped `Review` check to the PR.

permissions:
  contents: read

jobs:
  # Review the diff with Claude, post findings, and resolve threads whose
  # defect is fixed. Skipped on fork PRs, which get neither repository secrets
  # nor a write token.
  review:
    name: Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # One review per PR at a time; a newer push cancels an older review, so
    # stale findings are not posted.
    concurrency:
      group: answerable-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: thomas-sodon/answerable-ai-review@0f36be76c555b50bee326bae44a2e513fe4be8e5 # v0
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # Fail while any finding is still unanswered (no Claude call, no credential).
  # Runs after the review so this push's own findings count and threads it
  # resolved as fixed count as answered: comments posted with GITHUB_TOKEN start
  # no workflow, so nothing else would re-run the gate. Runs whether the review
  # passed, failed or was skipped, but not when a newer push cancelled it.
  replies:
    name: Reply coverage
    needs: review
    if: ${{ !cancelled() && needs.review.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # Replies use their own groups (answerable-ai-review-replies.yml), so a
    # reply never cancels the gate a push's review is waiting on.
    concurrency:
      group: answerable-replies-${{ github.event.pull_request.number }}-push
      cancel-in-progress: true
    steps:
      - uses: thomas-sodon/answerable-ai-review@0f36be76c555b50bee326bae44a2e513fe4be8e5 # v0
        with:
          mode: replies
